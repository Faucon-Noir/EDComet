packages:
  - backend
  - frontend
  - shared
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  esbuild: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - esbuild@0.24.3 || 0.28.1
  - path-to-regexp@8.4.0
  - vite@6.4.2 || 6.4.3
  - '@nestjs/core@11.1.18'
  - ip-address@10.1.1 || 10.3.1
  - qs@6.15.2
  - '@hapi/wreck@18.1.1 || 18.1.2'
  - '@hapi/content@6.0.2'
  - react-router@7.14.0 || 7.14.1 || 7.14.2 || 7.15.0 || 7.15.1 || 7.18.0 || 7.18.2
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.6 || 5.0.7 || 5.0.8 || 5.0.9
  - shell-quote@1.8.4 || 1.8.5
  - axios@1.16.0 || 1.18.0
  - form-data@4.0.6
  - multer@2.2.0
  - ts-deepmerge@8.0.0
  - js-yaml@4.1.2 || 4.3.0 || 4.3.1
  - '@babel/core@7.29.1'
  - body-parser@1.20.6 || 2.3.0
  - postcss@8.5.18 || 8.5.23
  - nanoid@3.3.16 || 3.3.18
overrides:
  basic-ftp@<=6.2.0: ^6.2.1
  file-type@>=13.0.0 <21.3.1: ^21.3.1
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  ts-deepmerge@<8.0.0: ^8.0.0
